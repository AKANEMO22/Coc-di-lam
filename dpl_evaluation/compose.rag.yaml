services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RAG_API_TOKEN: ${RAG_API_TOKEN:?Set a backend token in your environment}
      RAG_TENANT_ID: local
      RAG_DB_PATH: /app/data/rag/index.db
      RAG_DEVICE: cpu
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set the Gemini API key in your environment}
    volumes:
      - rag_index:/app/data/rag
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped
volumes:
  rag_index:
  model_cache:

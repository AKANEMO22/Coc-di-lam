# Upstreams are resolved per request through Docker DNS, so the edge starts even while a service
# is still being created, and follows containers that are recreated with a new address.
resolver 127.0.0.11 valid=10s ipv6=off;
# Relative redirects: the host port (8031) differs from the container port (8081).
absolute_redirect off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# 8080 - public interview UI (web serves the app and forwards /api/, /ws/ to the gateway).
server {
    listen 8080;
    client_max_body_size 30m;
    location = /__edge/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        set $upstream http://web:8080;
        proxy_pass $upstream;
        include /etc/nginx/dpl/proxy.conf;
    }
}

# 8081 - core agent: Studio (/test/), Inspect (/inspect/) and its API.
server {
    listen 8081;
    client_max_body_size 30m;
    include /etc/nginx/dpl/login.conf;
    location = / {
        include /etc/nginx/dpl/gate.conf;
        return 302 /test/;
    }
    location / {
        include /etc/nginx/dpl/gate.conf;
        set $upstream http://app:8000;
        proxy_pass $upstream;
        include /etc/nginx/dpl/proxy.conf;
    }
}

# 8082 - RAG / ID_Q service: intake page (/idq/), knowledge admin and its API.
server {
    listen 8082;
    client_max_body_size 50m;
    include /etc/nginx/dpl/login.conf;
    location = / {
        include /etc/nginx/dpl/gate.conf;
        return 302 /idq/;
    }
    location / {
        include /etc/nginx/dpl/gate.conf;
        set $upstream http://rag-idq:8000;
        proxy_pass $upstream;
        include /etc/nginx/dpl/proxy.conf;
    }
}

# 8083 - MinIO console (then the MinIO root user/password).
server {
    listen 8083;
    client_max_body_size 0;
    include /etc/nginx/dpl/login.conf;
    location / {
        include /etc/nginx/dpl/gate.conf;
        set $upstream http://minio:9001;
        proxy_pass $upstream;
        include /etc/nginx/dpl/proxy.conf;
        proxy_buffering off;
    }
}

# 8084 - RedisInsight (has no login of its own).
server {
    listen 8084;
    include /etc/nginx/dpl/login.conf;
    location / {
        include /etc/nginx/dpl/gate.conf;
        set $upstream http://redisinsight:5540;
        proxy_pass $upstream;
        include /etc/nginx/dpl/proxy.conf;
    }
}

# 8085 - speech service test page and API.
server {
    listen 8085;
    client_max_body_size 30m;
    include /etc/nginx/dpl/login.conf;
    location / {
        include /etc/nginx/dpl/gate.conf;
        set $upstream http://speech:8000;
        proxy_pass $upstream;
        include /etc/nginx/dpl/proxy.conf;
    }
}

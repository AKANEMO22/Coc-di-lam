# The password is checked only here (access phase, before the page is served), then a cookie
# carries the login. Apps keep their own Authorization headers (e.g. Bearer tokens of Studio).
# The cookie is per host, so one login covers every admin port of the edge.
location = /__edge/login {
    auth_basic "DPL - khu vuc quan tri";
    auth_basic_user_file /etc/nginx/dpl/htpasswd;
    add_header Set-Cookie "dpl_edge=__EDGE_TOKEN__; Path=/; HttpOnly; SameSite=Strict; Max-Age=43200" always;
    add_header Cache-Control "no-store" always;
    default_type text/html;
    alias /etc/nginx/dpl/logged-in.html;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 30m;

  # Behind the edge (root compose) the client address arrives in X-Real-IP, set by the edge from its own
  # $remote_addr. Trust it only from container networks, then hand the gateway the real client address
  # (gateway TRUST_PROXY_HEADERS=true reads X-Real-IP) so rate limits are per client, not per proxy.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Real-IP;

  # Text assets (JS, CSS, the avatar's JSON motions) shrink 70-80% on the wire.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm
             application/octet-stream;

  location /api/ {
    proxy_pass http://gateway:8020;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Creating a session waits for the ID_Q pack (up to RAG_TIMEOUT_SEC=180 s, web search for the JD
    # included) and then the core: 120 s cut it off with a 504 while the gateway kept working.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  location /ws/ {
    proxy_pass http://gateway:8020;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  # Vite build output: file names carry a content hash, so they never change and can be kept for a year.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  # The avatar (~40 MB) and images keep their names across releases: serve from cache for a day, then
  # revalidate in the background (ETag) so an update still arrives without making the room wait.
  location ~ ^/(linh|images)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
  }
  location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
  }
  # index.html (and every SPA route) must always be revalidated, or a tab keeps pointing at the
  # JS chunks of the previous release after a deploy.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
